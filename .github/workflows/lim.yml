name: BUE-LIM flight prices

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/lim.py, scripts/sky.py, .github/workflows/lim.yml]

permissions:
  contents: write

concurrency:
  group: lim
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # JetSMART needs a real browser to get past its anti-bot challenge
      - run: |
          pip install -q playwright
          python3 -m playwright install --with-deps chromium
      # previous run's file carries the price history
      - run: |
          mkdir out
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/lim/lim.json" -o prev.json || true
          python3 scripts/lim.py out/lim.json prev.json
      # own single-commit orphan branch, like sky/data
      - run: |
          cd out
          git init -q -b lim
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lim.json
          git commit -qm "BUE-LIM prices $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lim
